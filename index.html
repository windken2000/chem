<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化學實驗室線上預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .tab-active {
            border-color: #3b82f6;
            background-color: #3b82f6;
            color: white;
        }
        .tab-inactive {
            border-color: #e5e7eb;
            background-color: white;
            color: #374151;
        }
        .calendar-cell {
            transition: all 0.2s ease-in-out;
            min-width: 120px;
        }
        .available {
            background-color: #f0fdf4; /* green-50 */
            color: #166534; /* green-800 */
        }
        .booked {
            background-color: #fee2e2; /* red-200 */
            color: #991b1b; /* red-800 */
            font-weight: 600;
        }
        .toast {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

        // 只允許學校帳號登入；管理員可以取消任何預約

        const ADMIN_EMAILS = ['windken2000@ms.mingdao.edu.tw', 'tina.chu@ms.mingdao.edu.tw'];

        // 3. 等待網頁元素載入後，執行所有操作
        document.addEventListener('DOMContentLoaded', function () {

            // --- 全域資料與常數 ---
            // 班級、教師、實驗室清單：預設值，管理員在「管理設定」儲存後改用資料庫中的設定
            const DEFAULT_LABS = ['A (亞佛加厥)', 'B (波以耳)', 'C (居禮)'];
            const DEFAULT_TEACHERS = ['丁鋐鎰', '王雅俐', '王志仁', '林佳靜', '林嘉宏', '紀丞哲', '陳文典', '陳國鼎', '陳義忠', '鄭立村', '蘇育慧', '林宗翰', '龍晁毅'];
            let LABS = DEFAULT_LABS.slice();
            const DAYS_OF_WEEK = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const PERIODS = [
                '第 1 節 (08:10-09:00)', '第 2 節 (09:10-10:00)', '第 3 節 (10:10-11:00)', '第 4 節 (11:10-12:00)',
                '第 5 節 (13:10-14:00)', '第 6 節 (14:10-15:00)', '第 7 節 (15:10-16:00)', '第 8 節 (16:10-17:00)'
            ];
            let TEACHERS = DEFAULT_TEACHERS.slice();
            let CLASSES = null; // 在 defaultClasses() 定義後初始化

            // --- 狀態管理 ---
            let reservations = {};
            LABS.forEach(lab => reservations[lab] = {});
            let currentLab = LABS[0];
            let currentUser = null;

            // --- 【重要】宣告所有會用到的網頁元素 ---
            const classSelect = document.getElementById('class-name');
            const teacherSelect = document.getElementById('teacher-name');
            const labSelect = document.getElementById('lab-name');
            const dateInput = document.getElementById('reservation-date');
            const periodSelect = document.getElementById('period');
            const bookBtn = document.getElementById('book-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const calendarContainer = document.getElementById('calendar-container');
            const labTabsContainer = document.getElementById('lab-tabs');
            const calendarTitle = document.getElementById('calendar-title');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            // 新增操作紀錄顯示區塊
            const logDisplay = document.getElementById('log-display');

            // --- 功能函數 (完整版) ---

            function showToast(message, isError = false) {
                toastMessage.textContent = message;
                toast.className = `toast show fixed bottom-5 right-5 py-3 px-6 rounded-lg shadow-xl ${isError ? 'bg-red-600' : 'bg-gray-800'} text-white`;
                setTimeout(() => {
                    toast.className = toast.className.replace('show', '');
                }, 3000);
            }

            function formatDate(date) {
                // 將日期格式化為 YYYY-MM-DD (使用本地時間，避免 UTC 造成早上 8 點前日期少一天)
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function parseDate(value) {
                // 將 YYYY-MM-DD 解析為本地時間的日期 (new Date('YYYY-MM-DD') 會被當成 UTC)
                if (value instanceof Date) return new Date(value);
                const [y, m, d] = String(value).split('-').map(Number);
                return new Date(y, m - 1, d);
            }

            function periodLabel(period) {
                // '第 1 節 (08:10-09:00)' -> '第 1 節'
                return String(period).replace(/\s*\(.*\)\s*$/, '');
            }

            function escapeHtml(value) {
                // 避免資料庫中的文字被當成 HTML 執行
                return String(value ?? '').replace(/[&<>"']/g, ch => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[ch]));
            }
            
            function formatDateTime(date) {
                // 將日期時間格式化為 YYYY-MM-DD HH:MM:SS
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            }
            
            function getWeekDays(selectedDate) {
                const date = parseDate(selectedDate);
                const day = date.getDay();
                // 計算本週一的日期 (如果 selectedDate 是星期日，則減去 6 天；否則減去 (day - 1) 天)
                const diff = date.getDate() - day + (day === 0 ? -6 : 1);
                const monday = new Date(date.setDate(diff));
                
                const week = [];
                for (let i = 0; i < 6; i++) { // 只顯示週一到週六
                    const nextDay = new Date(monday);
                    nextDay.setDate(monday.getDate() + i);
                    week.push(nextDay);
                }
                return week;
            }

            function defaultClasses() {
                // 預設班級清單 (資料庫還沒有設定時使用)
                const list = [];
                [['高', 12], ['國', 20]].forEach(([prefix, count]) => {
                    ['一', '二', '三'].forEach(year => {
                        for (let c = 1; c <= count; c++) list.push(`${prefix}${year}${c}班`);
                    });
                });
                ['國一', '國二', '國三'].forEach(grade => {
                    ['理資A', '理資B', '理資C', '拔尖'].forEach(name => list.push(`${grade}${name}班`));
                });
                return list;
            }

            function classGroupOf(className) {
                if (/理資|拔尖|資優/.test(className)) return '資優班';
                if (className.startsWith('高')) return '高中部';
                if (className.startsWith('國')) return '國中部';
                return '其他';
            }

            function fillSelect(select, items, group) {
                // 重新產生下拉選單，並盡量保留原本選取的值
                const previous = select.value;
                select.innerHTML = '';
                if (group) {
                    const groups = {};
                    items.forEach(item => (groups[group(item)] = groups[group(item)] || []).push(item));
                    ['高中部', '國中部', '資優班', '其他'].filter(name => groups[name]).forEach(name => {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = name;
                        groups[name].forEach(item => optgroup.appendChild(new Option(item, item)));
                        select.appendChild(optgroup);
                    });
                } else {
                    items.forEach(item => select.appendChild(new Option(item, item)));
                }
                if (items.includes(previous)) select.value = previous;
            }

            function populateSelects() {
                fillSelect(classSelect, CLASSES, classGroupOf);
                fillSelect(teacherSelect, TEACHERS);
                fillSelect(labSelect, LABS);
            }

            function renderCalendar() {
                const weekDays = getWeekDays(dateInput.value || new Date());
                const weekStart = weekDays[0];
                const weekEnd = weekDays[5];
                calendarTitle.textContent = `預約行事曆 (${formatDate(weekStart)} ~ ${formatDate(weekEnd)})`;
                
                let html = `<table class="min-w-full border-collapse border border-gray-200">`;
                html += `<thead class="bg-gray-100"><tr class="text-center">`;
                html += `<th class="p-3 border border-gray-200 font-semibold text-gray-600">節次</th>`;
                weekDays.forEach((date, index) => {
                    html += `<th class="p-3 border border-gray-200 font-semibold text-gray-600">
                                <div>${DAYS_OF_WEEK[index]}</div>
                                <div class="text-xs font-normal">${formatDate(date).substring(5)}</div>
                             </th>`;
                });
                html += `</tr></thead>`;
                html += `<tbody>`;
                PERIODS.forEach((period) => {
                    html += `<tr class="text-center">`;
                    html += `<td class="p-3 border border-gray-200 font-medium text-sm text-gray-500">${periodLabel(period)}<br><span class="text-xs">${period.match(/\((.*)\)/)[1]}</span></td>`;
                    weekDays.forEach((date) => {
                        const key = `${formatDate(date)}-${period}`;
                        const reservation = reservations[currentLab] ? reservations[currentLab][key] : null;
                        if (reservation) {
                            html += `<td class="p-3 border border-gray-200 calendar-cell booked text-sm">
                                            <div class="font-bold">${escapeHtml(reservation.class)}</div>
                                            <div class="text-xs mt-1">${escapeHtml(reservation.teacher)}</div>
                                        </td>`;
                        } else {
                            html += `<td class="p-3 border border-gray-200 calendar-cell available text-sm">
                                            <div>開放預約</div>
                                        </td>`;
                        }
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
                calendarContainer.innerHTML = html;
            }

            function renderTabs() {
                labTabsContainer.innerHTML = '';
                LABS.forEach(lab => {
                    const tab = document.createElement('button');
                    tab.textContent = lab.split(' ')[0];
                    tab.className = `px-4 py-2 text-sm font-medium rounded-md border transition ${lab === currentLab ? 'tab-active' : 'tab-inactive'}`;
                    tab.onclick = () => {
                        currentLab = lab;
                        renderTabs();
                        renderCalendar();
                    };
                    labTabsContainer.appendChild(tab);
                });
            }
            
            // --- 新增：操作紀錄功能 ---

            /**
             * 將操作訊息寫入 Firebase 的 'logs' 節點。
             * @param {string} type 操作類型 (e.g., '預約', '取消', '錯誤')
             * @param {string} message 具體訊息
             * @param {object} details 相關預約或操作細節
             */
            function writeLogEntry(type, message, details = {}) {
                const now = new Date();
                const timestamp = now.getTime(); // 使用時間戳作為唯一 ID
                const formattedTime = formatDateTime(now);

                const logEntry = {
                    timestamp: timestamp,
                    dateTime: formattedTime,
                    type: type,
                    message: message,
                    ...details,
                    // 記錄操作者的登入帳號
                    uid: currentUser ? currentUser.uid : null,
                    email: currentUser ? currentUser.email : null,
                    userName: currentUser ? (currentUser.displayName || '') : null
                };

                // 將紀錄推送到 'logs' 節點
                database.ref('logs').child(timestamp).set(logEntry)
                    .then(() => {
                        console.log("紀錄寫入成功:", logEntry);
                    })
                    .catch((error) => {
                        console.error("紀錄寫入失敗:", error);
                    });
            }

            // 產生單筆操作紀錄的顯示元素 (最新紀錄與完整紀錄共用)
            function renderLogItem(log) {
                        const logItem = document.createElement('div');
                        let detailHtml = '';
                        const type = String(log.type || '');
                        const actionText = type === '預約成功' ? '預約了'
                            : type === '取消成功' ? '取消了'
                            : type.startsWith('取消') || log.action === '嘗試取消' ? '嘗試取消'
                            : '嘗試預約';
                        const slotHtml = log.lab && log.date && log.period
                            ? `<span class="font-semibold">${escapeHtml(log.lab)}</span> 在 <span class="font-semibold">${escapeHtml(log.date)} ${escapeHtml(periodLabel(log.period))}</span>`
                            : '';
                        if (log.class && log.teacher && slotHtml) {
                            detailHtml = `<span class="font-semibold">${escapeHtml(log.class)}</span> <span class="text-gray-600">(${escapeHtml(log.teacher)})</span> ${actionText} ${slotHtml}`;
                        } else if (slotHtml) {
                            detailHtml = `實驗室 ${slotHtml}`;
                        }

                        let messageColorClass = 'text-gray-700';
                        if (log.type === '預約成功') {
                            messageColorClass = 'text-green-700';
                        } else if (log.type === '取消成功') {
                            messageColorClass = 'text-blue-700';
                        } else if (log.type === '預約失敗' || log.type === '取消失敗' || log.type === '操作錯誤') {
                            messageColorClass = 'text-red-700';
                        }

                        logItem.className = `p-2 rounded-md ${type.includes('成功') ? 'bg-green-50' : type.includes('失敗') || type.includes('錯誤') ? 'bg-red-50' : 'bg-gray-100'} shadow-sm`;
                        logItem.innerHTML = `
                            <div class="text-xs text-gray-500 mb-1">${escapeHtml(log.dateTime)}</div>
                            <div class="${messageColorClass} font-medium">${escapeHtml(log.message)}</div>
                            ${detailHtml ? `<div class="text-xs text-gray-600 mt-1">${detailHtml}</div>` : ''}
                            ${log.email ? `<div class="text-xs text-gray-400 mt-1">操作帳號：${escapeHtml(log.userName ? `${log.userName} (${log.email})` : log.email)}</div>` : ''}
                        `;
                        return logItem;
            }

            // 監聽 Firebase 'logs' 節點的變化並顯示 (紀錄含帳號資訊，登入後才能讀取)
            const logsRef = database.ref('logs');
            const recentLogsQuery = logsRef.limitToLast(20); // 只顯示最新的20條紀錄
            function onRecentLogs(snapshot) {
                const logsData = snapshot.val();
                logDisplay.innerHTML = ''; // 清空現有紀錄
                if (logsData) {
                    // 將物件轉換為陣列並按時間戳排序 (最新的在前)
                    const sortedLogs = Object.values(logsData).sort((a, b) => b.timestamp - a.timestamp);
                    sortedLogs.forEach(log => logDisplay.appendChild(renderLogItem(log)));
                } else {
                    logDisplay.innerHTML = '<p class="text-gray-500">尚無操作紀錄。</p>';
                }
                // 最新紀錄排在最上面，讓滾動條回到頂端
                logDisplay.scrollTop = 0;
            }
            function onRecentLogsError(error) {
                logDisplay.innerHTML = `<p class="text-red-600">無法讀取操作紀錄：${escapeHtml(error.message)}</p>`;
            }

            // --- 完整操作紀錄 (點按鈕後開啟) ---
            const PAGE_SIZE = 50;
            const fullLogModal = document.getElementById('full-log-modal');
            const fullLogList = document.getElementById('full-log-list');
            const fullLogCount = document.getElementById('full-log-count');
            const fullLogMore = document.getElementById('full-log-more');
            const fullLogSearch = document.getElementById('full-log-search');
            const fullLogType = document.getElementById('full-log-type');
            const fullLogLab = document.getElementById('full-log-lab');
            const fullLogFrom = document.getElementById('full-log-from');
            const fullLogTo = document.getElementById('full-log-to');
            let allLogs = [];
            let filteredLogs = [];
            let shownCount = 0;

            function refreshFullLogLabOptions() {
                const previous = fullLogLab.value;
                fullLogLab.innerHTML = '<option value="">全部實驗室</option>';
                LABS.forEach(lab => fullLogLab.appendChild(new Option(lab, lab)));
                if (LABS.includes(previous)) fullLogLab.value = previous;
            }
            refreshFullLogLabOptions();

            function openFullLog() {
                fullLogModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                fullLogList.innerHTML = '<p class="text-gray-500 p-2">載入中...</p>';
                fullLogCount.textContent = '';
                fullLogMore.classList.add('hidden');
                // 每次開啟時重新讀取，確保看到最新的完整紀錄
                logsRef.once('value').then((snapshot) => {
                    allLogs = Object.values(snapshot.val() || {}).sort((a, b) => b.timestamp - a.timestamp);
                    applyLogFilters();
                }).catch((error) => {
                    fullLogList.innerHTML = `<p class="text-red-600 p-2">讀取失敗：${escapeHtml(error.message)}</p>`;
                });
            }

            function closeFullLog() {
                fullLogModal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            function applyLogFilters() {
                const keyword = fullLogSearch.value.trim().toLowerCase();
                const type = fullLogType.value;
                const lab = fullLogLab.value;
                const from = fullLogFrom.value;
                const to = fullLogTo.value;
                filteredLogs = allLogs.filter(log => {
                    const logType = String(log.type || '');
                    if (type === 'fail' && !(logType.includes('失敗') || logType.includes('錯誤'))) return false;
                    if (type && type !== 'fail' && logType !== type) return false;
                    if (lab && log.lab !== lab) return false;
                    const day = String(log.dateTime || '').slice(0, 10);
                    if (from && day < from) return false;
                    if (to && day > to) return false;
                    if (keyword) {
                        const text = [log.message, log.class, log.teacher, log.lab, log.date, log.email, log.userName].join(' ').toLowerCase();
                        if (!text.includes(keyword)) return false;
                    }
                    return true;
                });
                fullLogList.innerHTML = '';
                shownCount = 0;
                if (filteredLogs.length === 0) {
                    fullLogList.innerHTML = '<p class="text-gray-500 p-2">沒有符合條件的紀錄。</p>';
                }
                showMoreLogs();
            }

            function showMoreLogs() {
                filteredLogs.slice(shownCount, shownCount + PAGE_SIZE).forEach(log => fullLogList.appendChild(renderLogItem(log)));
                shownCount = Math.min(shownCount + PAGE_SIZE, filteredLogs.length);
                fullLogCount.textContent = `共 ${allLogs.length} 筆紀錄，符合條件 ${filteredLogs.length} 筆，目前顯示 ${shownCount} 筆`;
                fullLogMore.classList.toggle('hidden', shownCount >= filteredLogs.length);
                fullLogMore.textContent = `顯示更多 (還有 ${filteredLogs.length - shownCount} 筆)`;
            }

            function downloadLogsCsv() {
                const header = ['操作時間', '類型', '訊息', '班級', '老師', '實驗室', '預約日期', '節次', '操作帳號', '帳號名稱'];
                const rows = filteredLogs.map(log => [log.dateTime, log.type, log.message, log.class, log.teacher, log.lab, log.date, log.period, log.email, log.userName]);
                const csv = [header, ...rows]
                    .map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(','))
                    .join('\r\n');
                // 加上 BOM，讓 Excel 正確顯示中文
                const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `實驗室預約操作紀錄_${formatDate(new Date())}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
            }

            document.getElementById('full-log-btn').addEventListener('click', openFullLog);
            document.getElementById('full-log-close').addEventListener('click', closeFullLog);
            document.getElementById('full-log-csv').addEventListener('click', downloadLogsCsv);
            fullLogMore.addEventListener('click', showMoreLogs);
            fullLogModal.addEventListener('click', (e) => { if (e.target === fullLogModal) closeFullLog(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !fullLogModal.classList.contains('hidden')) closeFullLog(); });
            fullLogSearch.addEventListener('input', applyLogFilters);
            fullLogSearch.placeholder = '搜尋班級、老師、帳號…';
            [fullLogType, fullLogLab, fullLogFrom, fullLogTo].forEach(el => el.addEventListener('change', applyLogFilters));


            // --- Firebase 資料庫處理 ---

            // 監聽 Firebase 資料庫的變化
            const reservationsRef = database.ref('reservations');
            let dataLoaded = false;
            reservationsRef.on('value', (snapshot) => {
                dataLoaded = true;
                const data = snapshot.val();
                if (data) {
                    reservations = data;
                    LABS.forEach(lab => {
                        if (!reservations[lab]) reservations[lab] = {};
                    });
                    console.log("從 Firebase 更新資料成功！");
                } else {
                    console.log("資料庫是空的，使用初始結構。");
                }
                renderCalendar();
            });

            // 預約與取消的處理函數 (使用 Firebase)
            function handleReservation(isBooking) {
                const className = classSelect.value;
                const teacherName = teacherSelect.value;
                const labName = labSelect.value;
                const selectedDate = parseDate(dateInput.value);
                const period = periodSelect.value;
                const formattedDate = formatDate(selectedDate); // 新增格式化日期

                if (!currentUser) {
                    showToast('請先使用學校 Google 帳號登入。', true);
                    return;
                }
                if (!dataLoaded) {
                    showToast('資料載入中，請稍候再試。', true);
                    return;
                }
                if (!dateInput.value || isNaN(selectedDate.getTime())) {
                    showToast('請選擇一個有效的預約日期。', true);
                    writeLogEntry('操作錯誤', '無效日期選擇', {
                        class: className,
                        teacher: teacherName,
                        lab: labName,
                        date: dateInput.value, // 使用原始輸入值
                        period: period,
                        action: isBooking ? '嘗試預約' : '嘗試取消'
                    });
                    return;
                }
                if (selectedDate.getDay() === 0) {
                    showToast('星期日不開放預約。', true);
                    writeLogEntry('操作錯誤', '星期日不開放預約', {
                        class: className,
                        teacher: teacherName,
                        lab: labName,
                        date: formattedDate,
                        period: period,
                        action: isBooking ? '嘗試預約' : '嘗試取消'
                    });
                    return;
                }
                if (isBooking && formattedDate < formatDate(new Date())) {
                    showToast('無法預約已經過去的日期。', true);
                    return;
                }

                const key = `${formattedDate}-${period}`;
                const reservationSlotRef = database.ref(`reservations/${labName}/${key}`);
                const logDetails = {
                    class: className,
                    teacher: teacherName,
                    lab: labName,
                    date: formattedDate,
                    period: period
                };

                // 注意：transaction 的更新函式可能被 Firebase 重複呼叫，
                // 所以這裡只決定要寫入什麼，提示與紀錄都放在完成回呼中處理。
                bookBtn.disabled = cancelBtn.disabled = true;
                const done = () => { bookBtn.disabled = cancelBtn.disabled = false; };

                if (isBooking) {
                    reservationSlotRef.transaction((currentData) => {
                        if (currentData === null) {
                            return { class: className, teacher: teacherName, uid: currentUser.uid };
                        }
                        return; // 已被預約，中止交易，不寫入
                    }, (error, committed, snapshot) => {
                        done();
                        if (error) {
                            showToast(`預約失敗：${error.message}`, true);
                            writeLogEntry('預約失敗', `系統錯誤：${error.message}`, logDetails);
                        } else if (committed) {
                            showToast(`預約成功：${className} 已預約 ${labName}。`);
                            writeLogEntry('預約成功', `${className} 成功預約`, logDetails);
                        } else {
                            const current = snapshot && snapshot.val();
                            const bookedBy = current ? current.class : '其他班級';
                            showToast(`預約失敗：該時段已被 ${bookedBy} 預約。`, true);
                            writeLogEntry('預約失敗', `該時段已被 ${bookedBy} 預約`, {
                                ...logDetails,
                                currentBookedBy: bookedBy // 記錄當前預約者
                            });
                        }
                    });
                } else { // Cancelling
                    const isAdmin = ADMIN_EMAILS.includes(currentUser.email);
                    // 可以取消的情況：管理員；登入後建立的預約只有預約者本人；
                    // 登入功能上線前的舊預約 (沒有 uid) 則需班級與老師都相符
                    const canCancel = (data) => isAdmin
                        || (data.uid ? data.uid === currentUser.uid
                            : data.class === className && data.teacher === teacherName);
                    let lastSeen = null; // 最後一次確認要刪除的預約內容
                    reservationSlotRef.transaction((currentData) => {
                        if (currentData !== null && canCancel(currentData)) {
                            lastSeen = currentData;
                            return null; // 移除該預約紀錄
                        }
                        return; // 找不到或沒有權限，中止交易
                    }, (error, committed, snapshot) => {
                        done();
                        const current = snapshot && snapshot.val();
                        if (error) {
                            showToast(`取消失敗：${error.message}`, true);
                            writeLogEntry('取消失敗', `系統錯誤：${error.message}`, logDetails);
                        } else if (committed) {
                            // 紀錄實際被取消的預約內容 (管理員可能取消別班的預約)
                            const removed = lastSeen;
                            const removedClass = removed ? removed.class : className;
                            showToast(`取消成功：已取消 ${removedClass} 在 ${labName} 的預約。`);
                            writeLogEntry('取消成功', `${removedClass} 成功取消預約`, {
                                ...logDetails,
                                class: removedClass,
                                teacher: removed ? removed.teacher : teacherName
                            });
                        } else if (!current) {
                            showToast('取消失敗：找不到該預約紀錄。', true);
                            writeLogEntry('取消失敗', '找不到該預約紀錄', logDetails);
                        } else {
                            const reason = current.uid ? '只有預約者本人可以取消這筆預約' : '預約資訊不符，無法取消';
                            showToast(`取消失敗：${reason}。`, true);
                            writeLogEntry('取消失敗', reason, {
                                ...logDetails,
                                actualBookedBy: current.class, // 記錄實際預約者
                                actualTeacher: current.teacher // 記錄實際預約老師
                            });
                        }
                    });
                }
            }
            
            // --- 初始化與事件綁定 ---
            
            // 1. 立即產生下拉選單、日期、和頁籤
            CLASSES = defaultClasses();
            populateSelects();
            dateInput.value = formatDate(new Date());
            renderTabs();
            
            // 2. 立即畫出一次行事曆的「框架」
            // (Firebase連上後會自動帶入資料並重畫一次)
            renderCalendar();
            
            // 3. 綁定按鈕事件
            bookBtn.addEventListener('click', () => handleReservation(true));
            cancelBtn.addEventListener('click', () => handleReservation(false));
            dateInput.addEventListener('change', renderCalendar);

            // 4. 班級、教師、實驗室設定 (存在資料庫 config 節點，管理員可修改)
            //    config = { classes: [...], teachers: [...], labs: { '實驗室名稱': 排序 } }
            const configRef = database.ref('config');

            function applyConfig(config) {
                if (config) {
                    if (Array.isArray(config.classes) && config.classes.length) CLASSES = config.classes.filter(Boolean);
                    if (Array.isArray(config.teachers) && config.teachers.length) TEACHERS = config.teachers.filter(Boolean);
                    if (config.labs && Object.keys(config.labs).length) {
                        LABS = Object.keys(config.labs).sort((a, b) => config.labs[a] - config.labs[b]);
                    }
                }
                if (!LABS.includes(currentLab)) currentLab = LABS[0];
                populateSelects();
                refreshFullLogLabOptions();
                renderTabs();
                renderCalendar();
            }

            function configPayload(classes, teachers, labs) {
                const labMap = {};
                labs.forEach((lab, index) => labMap[lab] = index + 1);
                return { classes: classes, teachers: teachers, labs: labMap };
            }

            configRef.on('value', (snapshot) => applyConfig(snapshot.val()));

            // --- 管理設定視窗 ---
            const adminModal = document.getElementById('admin-modal');
            const adminStatus = document.getElementById('admin-status');
            const ADMIN_LIST_RULES = {
                classes: { label: '班級', maxLength: 20 },
                teachers: { label: '教師', maxLength: 10 },
                labs: { label: '實驗室', maxLength: 20 }
            };
            let adminDraft = null;

            function isAdmin() {
                return !!currentUser && ADMIN_EMAILS.includes(currentUser.email);
            }

            function renderAdminList(name) {
                const section = adminModal.querySelector(`[data-list="${name}"]`);
                const container = section.querySelector('[data-items]');
                container.innerHTML = '';
                adminDraft[name].forEach((item, index) => {
                    const chip = document.createElement('span');
                    chip.className = 'inline-flex items-center gap-1 pl-2.5 pr-1 py-1 bg-gray-100 border border-gray-200 rounded-full text-sm text-gray-700';
                    chip.textContent = item;
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'w-5 h-5 rounded-full text-gray-400 hover:bg-red-100 hover:text-red-600 leading-none';
                    remove.textContent = '×';
                    remove.title = `移除 ${item}`;
                    remove.addEventListener('click', () => {
                        if (name === 'labs' && adminDraft.labs.length === 1) {
                            showToast('至少要保留一間實驗室。', true);
                            return;
                        }
                        adminDraft[name].splice(index, 1);
                        renderAdminList(name);
                    });
                    chip.appendChild(remove);
                    container.appendChild(chip);
                });
                section.querySelector('[data-count]').textContent = `(${adminDraft[name].length})`;
            }

            function addAdminItem(name) {
                const input = adminModal.querySelector(`[data-list="${name}"] [data-input]`);
                const value = input.value.trim();
                const rule = ADMIN_LIST_RULES[name];
                if (!value) return;
                if (value.length > rule.maxLength) {
                    showToast(`${rule.label}名稱最多 ${rule.maxLength} 個字。`, true);
                    return;
                }
                if (name === 'labs' && /[.#$\[\]\/]/.test(value)) {
                    showToast('實驗室名稱不能包含 . # $ [ ] / 這些符號。', true);
                    return;
                }
                if (adminDraft[name].includes(value)) {
                    showToast(`「${value}」已經在清單中。`, true);
                    return;
                }
                adminDraft[name].push(value);
                input.value = '';
                input.focus();
                renderAdminList(name);
            }

            function openAdmin() {
                if (!isAdmin()) return;
                adminDraft = { classes: CLASSES.slice(), teachers: TEACHERS.slice(), labs: LABS.slice() };
                Object.keys(ADMIN_LIST_RULES).forEach(renderAdminList);
                adminStatus.textContent = '';
                adminModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function closeAdmin() {
                adminModal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            Object.keys(ADMIN_LIST_RULES).forEach(name => {
                const section = adminModal.querySelector(`[data-list="${name}"]`);
                section.querySelector('[data-add]').addEventListener('click', () => addAdminItem(name));
                section.querySelector('[data-input]').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); addAdminItem(name); }
                });
            });

            document.getElementById('admin-btn').addEventListener('click', openAdmin);
            document.getElementById('admin-close').addEventListener('click', closeAdmin);
            document.getElementById('admin-cancel').addEventListener('click', closeAdmin);
            adminModal.addEventListener('click', (e) => { if (e.target === adminModal) closeAdmin(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !adminModal.classList.contains('hidden')) closeAdmin(); });

            document.getElementById('admin-save').addEventListener('click', () => {
                if (!isAdmin()) return;
                const saveBtn = document.getElementById('admin-save');
                saveBtn.disabled = true;
                adminStatus.textContent = '儲存中...';
                configRef.set(configPayload(adminDraft.classes, adminDraft.teachers, adminDraft.labs)).then(() => {
                    writeLogEntry('設定變更', '管理員更新了班級、教師、實驗室清單', {
                        classCount: adminDraft.classes.length,
                        teacherCount: adminDraft.teachers.length,
                        labs: adminDraft.labs.join('、')
                    });
                    showToast('設定已儲存，所有老師的選項已更新。');
                    closeAdmin();
                }).catch((error) => {
                    adminStatus.textContent = '';
                    showToast(`儲存失敗：${error.message}`, true);
                }).finally(() => { saveBtn.disabled = false; });
            });

            // 5. Google 登入
            const authSignedOut = document.getElementById('auth-signed-out');
            const authSignedIn = document.getElementById('auth-signed-in');
            const authUserLabel = document.getElementById('auth-user');
            const fullLogBtnWrap = document.getElementById('full-log-btn-wrap');

            function isAllowedEmail(email) {
                return String(email || '').toLowerCase().endsWith('@' + ALLOWED_EMAIL_DOMAIN);
            }

            document.getElementById('sign-in-btn').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                // hd 讓 Google 優先顯示學校帳號；真正的限制在下方檢查與資料庫安全規則
                provider.setCustomParameters({ hd: ALLOWED_EMAIL_DOMAIN, prompt: 'select_account' });
                // 使用彈出視窗登入 (跳轉登入在擋第三方 Cookie 的瀏覽器中會失敗，所以不使用)
                auth.signInWithPopup(provider).catch((error) => {
                    if (error.code === 'auth/popup-blocked') {
                        showToast('登入視窗被瀏覽器擋住了，請允許此網站開啟彈出式視窗後再試一次。', true);
                    } else if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                        showToast(`登入失敗：${error.message}`, true);
                    }
                });
            });

            document.getElementById('sign-out-btn').addEventListener('click', () => auth.signOut());

            auth.onAuthStateChanged((user) => {
                if (user && !isAllowedEmail(user.email)) {
                    showToast(`請使用 @${ALLOWED_EMAIL_DOMAIN} 的學校帳號登入。`, true);
                    auth.signOut();
                    return;
                }
                currentUser = user;
                authSignedOut.classList.toggle('hidden', !!user);
                authSignedIn.classList.toggle('hidden', !user);
                fullLogBtnWrap.classList.toggle('hidden', !user);
                document.getElementById('admin-btn').classList.toggle('hidden', !isAdmin());
                if (!isAdmin()) closeAdmin();
                // 資料庫還沒有設定時，管理員登入後自動寫入目前的預設清單
                if (isAdmin()) {
                    configRef.once('value').then((snapshot) => {
                        if (!snapshot.exists()) return configRef.set(configPayload(CLASSES, TEACHERS, LABS));
                    }).catch((error) => console.error('初始化設定失敗:', error));
                }
                bookBtn.disabled = cancelBtn.disabled = !user;
                bookBtn.classList.toggle('opacity-50', !user);
                cancelBtn.classList.toggle('opacity-50', !user);
                recentLogsQuery.off('value', onRecentLogs);
                if (user) {
                    authUserLabel.textContent = user.displayName ? `${user.displayName} (${user.email})` : user.email;
                    logDisplay.innerHTML = '載入中...';
                    recentLogsQuery.on('value', onRecentLogs, onRecentLogsError);
                } else {
                    authUserLabel.textContent = '';
                    closeFullLog();
                    logDisplay.innerHTML = '<p class="text-gray-500">登入後才能查看操作紀錄。</p>';
                }
            });
        });
    </script>

</body>
</html>
